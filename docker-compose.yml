services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
      JWT_SECRET: s3cr3t
      SECRET_KEY: dev-session-key
      # AES-256-GCM key for notes.comment (lab 03). Generate your own with:
      # python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
      COMMENT_KEY: 8PIZtb5IDKBFjk1XnkQlHXvkusf752LoN/sCvmzgfOk=
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy
    # Flaw #13: the container runs as root (see Dockerfile) and mounts more than it
    # needs - the host Docker socket and the whole project tree are exposed to it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host

volumes:
  pgdata:
