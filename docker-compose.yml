services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
      # Real secret lives in .env (git-ignored), never in this file: a 256-bit
      # random value, no weak default (fix #4.3). See .env.example.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      SECRET_KEY: dev-session-key
      # Real keys live in .env (git-ignored), never in this file. See .env.example.
      # AES-256-GCM key for notes.comment (lab 03).
      COMMENT_KEY: ${COMMENT_KEY:?set COMMENT_KEY in .env (see .env.example)}
      # HMAC-SHA256 key for the grades CSV export (lab 04). Must differ from
      # COMMENT_KEY: one key per purpose.
      EXPORT_HMAC_KEY: ${EXPORT_HMAC_KEY:?set EXPORT_HMAC_KEY in .env (see .env.example)}
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy
    # No host mounts: the app needs neither the Docker socket nor the project tree.

volumes:
  pgdata:
